[workspace]
members = ["crates/bv-protocol", "crates/bv-renderer", "crates/bv-sim"]
default-members = ["crates/bv-sim"]
resolver = "3"

[workspace.package]
version = "0.1.5"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
anyhow = "1"
bevy = { version = "0.19", features = ["jpeg"] }
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
flatbuffers = "=25.2.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
bv-protocol = { path = "crates/bv-protocol" }
bv-renderer = { path = "crates/bv-renderer" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
strip = "debuginfo"

