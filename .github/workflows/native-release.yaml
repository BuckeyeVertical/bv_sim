name: Native release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
            executable: bv-sim
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: bv-sim
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: bv-sim.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - name: Verify release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Tag $RELEASE_TAG does not match Cargo.toml version $version; expected v$version. Commit the version change before tagging."
            exit 1
          fi
      - run: cargo build --release --locked --package bv-sim --target ${{ matrix.target }}
      - name: Verify Windows executable and installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/test_install.ps1 -Binary target/${{ matrix.target }}/release/bv-sim.exe
      - run: python packaging/bundle.py target/${{ matrix.target }}/release/${{ matrix.executable }} ${{ matrix.target }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: bv-sim-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.BV_SIM_PUBLISH_RELEASES == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update versioned release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --verify-tag --title "BV Sim $RELEASE_TAG" --notes "Native renderer and runtime assets. The launcher uses the latest published backend image by default; use --image to select a specific image."
          gh release upload "$RELEASE_TAG" dist/* --clobber
