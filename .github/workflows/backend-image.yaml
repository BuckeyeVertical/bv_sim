name: Backend image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Enable only after this directory becomes the destination repository and
    # its registry namespace/default launcher image have been configured.
    if: vars.BV_SIM_PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version and configured image repository
        id: release
        env:
          IMAGE_REPOSITORY: ${{ vars.BV_SIM_IMAGE_REPOSITORY }}
          GIT_REF_NAME: ${{ github.ref_name }}
          GIT_REF_TYPE: ${{ github.ref_type }}
        run: |
          test -n "$IMAGE_REPOSITORY"
          case "$IMAGE_REPOSITORY" in ghcr.io/*) ;; *) echo "Set BV_SIM_IMAGE_REPOSITORY to ghcr.io/buckeyevertical/bv-sim-backend" >&2; exit 1 ;; esac
          version="$(cat VERSION)"
          if [ "$GIT_REF_TYPE" = tag ]; then test "$GIT_REF_NAME" = "v$version"; fi
          printf 'image=%s\nversion=%s\n' "$IMAGE_REPOSITORY" "$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ vars.BV_SIM_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend-release
          cache-to: type=gha,mode=max,scope=backend-release
