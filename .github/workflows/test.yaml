name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Linux native window/audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev libx11-dev libxi-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: python tools/generate_protocol.py --check
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: python -m unittest discover -s tools/camera -p 'test_*.py'
      - run: python -m unittest discover -s backend/px4 -p 'test_*.py'
      - run: python -m unittest discover -s packaging -p 'test_*.py'
        if: runner.os != 'Windows'
      - run: bash -n install.sh packaging/install.sh backend/entrypoint.sh
        if: runner.os != 'Windows'
      - run: cargo build --locked -p bv-sim
        if: runner.os == 'Windows'
      - run: ./packaging/test_install.ps1 -Binary target/debug/bv-sim.exe
        if: runner.os == 'Windows'
        shell: pwsh
      - run: ./packaging/test_download_install.ps1 -Binary target/debug/bv-sim.exe
        if: runner.os == 'Windows'
        shell: pwsh

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build bridge and run backend protocol tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: bridge-build
          push: false
          cache-from: type=gha,scope=bridge-tests
          cache-to: type=gha,mode=max,scope=bridge-tests
